name: Build app

# Run by hand (Actions tab > "Build app" > Run workflow) to get build artifacts, or push a version tag
# (for example v1.5) to build both apps and publish them as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon (macos-14 is rejected on this account, macos-13 never starts)
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Build
        run: pyinstaller --noconfirm packaging/marker_cutter.spec
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Marker Cutter.app" "MarkerCutter-${{ matrix.name }}.zip"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Marker Cutter" -DestinationPath "MarkerCutter-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MarkerCutter-${{ matrix.name }}
          path: MarkerCutter-${{ matrix.name }}.zip

  release:
    # only for version tags: attach both builds to a GitHub release named after the tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MarkerCutter-*
          merge-multiple: true
          path: release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Marker Cutter $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
